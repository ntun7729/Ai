<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Website</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero">
        <p class="eyebrow">Cloudflare Worker + OpenAI-compatible API</p>
        <h1>AI Chat Website</h1>
        <p class="hero-copy">
          Ask a question and the Worker will safely call your configured AI provider.
        </p>
      </section>

      <section class="chat-card" aria-label="AI chat">
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="prompt">Message</label>
          <textarea
            id="prompt"
            name="prompt"
            rows="3"
            placeholder="Ask anything..."
            required
          ></textarea>
          <button id="send-button" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
